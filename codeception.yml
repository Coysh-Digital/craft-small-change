namespace: coyshdigital\smallchange\tests
actor_suffix: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
bootstrap: _bootstrap.php
params:
    - env
settings:
    colors: true
    memory_limit: 1024M
modules:
    config:
        \craft\test\Craft:
            configFile: 'tests/_craft/config/test.php'
            entryUrl: 'https://small-change.test/index.php'
            entryScript: index.php
            cleanup: true
            transaction: true
            dbSetup: { clean: true, setupCraft: true }
            plugins:
                small-change:
                    class: '\coyshdigital\smallchange\Plugin'
                    handle: small-change
